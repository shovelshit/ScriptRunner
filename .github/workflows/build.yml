name: Build and Release APK

# 推送形如 v1.0.0 的 tag 时触发：自动构建 APK，并把 APK + version.json 一并
# 发布到与该 tag 对应的 GitHub Release，供 App 内「检查更新」功能读取。
on:
  push:
    tags:
      - 'v*.*.*'

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version info from tag
        id: version
        run: |
          # tag 形如 refs/tags/v1.2.3 -> versionName=1.2.3
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          # versionCode 用 GitHub Actions 的自增运行号，保证每次发布都严格递增，
          # 不需要在仓库里手动维护一个计数器。
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --console=plain

      - name: Rename APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEST="app-${{ steps.version.outputs.version_name }}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        run: |
          cat > version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "changelog": "详见 Release 说明: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}",
            "apkUrl": "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.apk.outputs.apk_name }}"
          }
          EOF
          cat version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          files: |
            ${{ steps.apk.outputs.apk_path }}
            version.json
          generate_release_notes: true

      - name: Publish APK to Gitee Release
        # 把同一份已构建好的 APK 同步发布到 Gitee Release，
        # 这样 Gitee 仓库也能直接下载到打包产物，不需要 Gitee 端重新构建。
        # 使用与 sync-to-gitee.yml 相同的 GITEE_TOKEN（Gitee 私人令牌）。
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: aka-ljf
          GITEE_REPO: ScriptRunner
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # 1. 创建 Gitee Release（若 tag 对应的 release 已存在则复用其 id）
          CREATE_RESP=$(curl -sS -X POST "${API}/releases" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "tag_name=${TAG_NAME}" \
            -d "name=${TAG_NAME}" \
            -d "body=同步自 GitHub Actions 构建产物" \
            -d "target_commitish=main")
          echo "create release response: ${CREATE_RESP}"

          RELEASE_ID=$(echo "${CREATE_RESP}" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -z "${RELEASE_ID}" ]; then
            echo "Release 可能已存在，尝试查询已有 release id"
            LIST_RESP=$(curl -sS "${API}/releases?access_token=${GITEE_TOKEN}&page=1&per_page=50")
            # 用 jq 按 tag_name 精确匹配对应的 release id（ubuntu-latest runner 已预装 jq），
            # 避免内嵌多行 Python/awk 脚本破坏 YAML 缩进。
            RELEASE_ID=$(echo "${LIST_RESP}" | jq -r --arg tag "${TAG_NAME}" '.[] | select(.tag_name == $tag) | .id' | head -1)
          fi

          if [ -z "${RELEASE_ID}" ]; then
            echo "无法获取 Gitee release id，跳过附件上传" >&2
            exit 1
          fi
          echo "Gitee release id: ${RELEASE_ID}"

          # 2. 生成指向 Gitee 下载地址的 version.json（供国内下载场景使用，
          #    与上传到 GitHub Release 的 version.json 区分开，避免互相覆盖）
          cat > version-gitee.json << EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "changelog": "详见 Release 说明: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/${TAG_NAME}",
            "apkUrl": "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG_NAME}/${APK_NAME}"
          }
          EOF
          cat version-gitee.json
          # Gitee 更新检查约定读取的文件名同样是 version.json
          cp version-gitee.json version.json

          # 3. 上传 APK 和 version.json 作为 Release 附件
          curl -sS -X POST "${API}/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_PATH}"

          curl -sS -X POST "${API}/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@version.json"
